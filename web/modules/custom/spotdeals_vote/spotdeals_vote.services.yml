services:
  spotdeals_vote.fields:
    class: Drupal\spotdeals_vote\VoteFields

  spotdeals_vote.storage:
    class: Drupal\spotdeals_vote\VoteStorage
    arguments: ['@database']

  spotdeals_vote.aggregate_storage:
    class: Drupal\spotdeals_vote\VoteAggregateStorage
    arguments: ['@database']

  spotdeals_vote.anonymous_identity:
    class: Drupal\spotdeals_vote\AnonymousVoteIdentity
    arguments:
      - '@current_user'
      - '@request_stack'
      - '@private_key'

  spotdeals_vote.anonymous_rate_limiter:
    class: Drupal\spotdeals_vote\AnonymousVoteRateLimiter
    arguments:
      - '@flood'
      - '@spotdeals_vote.anonymous_identity'

  spotdeals_vote.manager:
    class: Drupal\spotdeals_vote\VoteManager
    arguments:
      - '@service_container'
