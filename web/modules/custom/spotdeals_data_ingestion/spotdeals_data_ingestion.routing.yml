spotdeals_data_ingestion.settings:
  path: '/admin/config/services/spotdeals-data-ingestion'
  defaults:
    _form: '\Drupal\spotdeals_data_ingestion\Form\DataIngestionSettingsForm'
    _title: 'SpotDeals Data Ingestion'
  requirements:
    _permission: 'administer spotdeals data ingestion'

spotdeals_data_ingestion.venue_search:
  path: '/api/spotdeals/venues/search'
  defaults:
    _controller: '\Drupal\spotdeals_data_ingestion\Controller\VenueSearchController::search'
  requirements:
    _access: 'TRUE'
  methods: [GET]
  options:
    no_cache: TRUE

spotdeals_data_ingestion.external_venue_report:
  path: '/external-venue/report'
  defaults:
    _form: '\Drupal\spotdeals_data_ingestion\Form\ExternalVenueReportForm'
    _title: 'Report closed or incorrect venue'
  requirements:
    _permission: 'submit external venue reports'
  options:
    no_cache: TRUE

spotdeals_data_ingestion.external_venue_reports:
  path: '/admin/content/external-venue-reports'
  defaults:
    _controller: '\Drupal\spotdeals_data_ingestion\Controller\ExternalVenueReportAdminController::listing'
    _title: 'External venue reports'
  requirements:
    _permission: 'review external venue reports'

spotdeals_data_ingestion.external_venue_report_review:
  path: '/admin/content/external-venue-reports/{report_id}'
  defaults:
    _form: '\Drupal\spotdeals_data_ingestion\Form\ExternalVenueReportReviewForm'
    _title: 'Review external venue report'
  requirements:
    _permission: 'review external venue reports'
    report_id: '\d+'


spotdeals_data_ingestion.deal_discovery_candidates:
  path: '/admin/content/spotdeals-deal-discovery'
  defaults:
    _controller: '\Drupal\spotdeals_data_ingestion\Controller\DealDiscoveryAdminController::listing'
    _title: 'SpotDeals deal discovery'
  requirements:
    _permission: 'review spotdeals deal discovery'

spotdeals_data_ingestion.deal_discovery_run:
  path: '/admin/content/spotdeals-deal-discovery/run'
  defaults:
    _form: '\Drupal\spotdeals_data_ingestion\Form\DealDiscoveryRunForm'
    _title: 'Run SpotDeals deal discovery'
  requirements:
    _permission: 'run spotdeals deal discovery'

spotdeals_data_ingestion.deal_discovery_candidate_review:
  path: '/admin/content/spotdeals-deal-discovery/{candidate_id}'
  defaults:
    _form: '\Drupal\spotdeals_data_ingestion\Form\DealDiscoveryReviewForm'
    _title: 'Review deal-discovery candidate'
  requirements:
    _permission: 'review spotdeals deal discovery'
    candidate_id: '\d+'


spotdeals_data_ingestion.deal_discovery_publish_preview:
  path: '/admin/content/spotdeals-deal-discovery/{candidate_id}/publish-preview'
  defaults:
    _controller: '\Drupal\spotdeals_data_ingestion\Controller\DealDiscoveryPublishPreviewController::preview'
    _title: 'Deal publishing preview'
  requirements:
    _permission: 'review spotdeals deal discovery'
    candidate_id: '\d+'


spotdeals_data_ingestion.deal_discovery_publish_audit:
  path: '/admin/content/spotdeals-deal-discovery/publish-audit'
  defaults:
    _controller: '\Drupal\spotdeals_data_ingestion\Controller\DealDiscoveryPublishAuditController::audit'
    _title: 'Deal publishing audit'
  requirements:
    _permission: 'review spotdeals deal discovery'


spotdeals_data_ingestion.deal_discovery_publish:
  path: '/admin/content/spotdeals-deal-discovery/{candidate_id}/publish'
  defaults:
    _form: '\Drupal\spotdeals_data_ingestion\Form\DealDiscoveryPublishForm'
    _title: 'Publish discovered deal'
  requirements:
    _permission: 'publish spotdeals deal discovery'
    candidate_id: '\d+'


spotdeals_data_ingestion.deal_discovery_publish_ready:
  path: '/admin/content/spotdeals-deal-discovery/publish-ready'
  defaults:
    _form: '\Drupal\spotdeals_data_ingestion\Form\DealDiscoveryPublishReadyForm'
    _title: 'Publish ready reviewed deals'
  requirements:
    _permission: 'publish spotdeals deal discovery'
