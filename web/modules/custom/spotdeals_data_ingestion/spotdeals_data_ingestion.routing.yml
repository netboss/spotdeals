spotdeals_data_ingestion.settings:
  path: '/admin/config/services/spotdeals-data-ingestion'
  defaults:
    _form: '\Drupal\spotdeals_data_ingestion\Form\DataIngestionSettingsForm'
    _title: 'SpotDeals Data Ingestion'
  requirements:
    _permission: 'administer spotdeals data ingestion'

spotdeals_data_ingestion.venue_search:
  path: '/api/spotdeals/venues/search'
  defaults:
    _controller: '\Drupal\spotdeals_data_ingestion\Controller\VenueSearchController::search'
  requirements:
    _access: 'TRUE'
  methods: [GET]
  options:
    no_cache: TRUE
