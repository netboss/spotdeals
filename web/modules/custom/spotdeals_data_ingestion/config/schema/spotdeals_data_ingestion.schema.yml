spotdeals_data_ingestion.settings:
  type: config_object
  label: 'SpotDeals data ingestion settings'
  mapping:
    page_size:
      type: integer
      label: 'Geoapify page size'
    max_pages:
      type: integer
      label: 'Maximum Geoapify pages'
    request_timeout:
      type: integer
      label: 'Geoapify request timeout'
    category_catalog_url:
      type: string
      label: 'Geoapify category catalog URL'
    category_catalog_max_age:
      type: integer
      label: 'Geoapify category catalog maximum cache age'
    category_catalog_minimum_size:
      type: integer
      label: 'Minimum accepted Geoapify category catalog size'
    mapping_min_score:
      type: float
      label: 'Minimum score for automatic venue-type mappings'
    mapping_ambiguity_delta:
      type: float
      label: 'Minimum score gap required to avoid ambiguous mappings'
    deal_discovery_auto_approve_score:
      type: integer
      label: 'Deal discovery automatic-approval score'
    deal_discovery_auto_approve_location_confidence:
      type: integer
      label: 'Deal discovery automatic-approval location confidence'
    deal_discovery_auto_approve_require_schedule:
      type: boolean
      label: 'Require schedule context for automatic approval'
    deal_discovery_auto_publish_enabled:
      type: boolean
      label: 'Automatically publish ready auto-approved deal-discovery candidates'
    deal_discovery_auto_publish_batch_size:
      type: integer
      label: 'Automatic deal-discovery publishing batch size per cron run'
    deal_discovery_scheduler_enabled:
      type: boolean
      label: 'Enable scheduled deal discovery via cron'
    deal_discovery_scheduler_venue_types:
      type: sequence
      label: 'Venue type term IDs selected for scheduled deal discovery'
      sequence:
        type: integer
        label: 'Venue type term ID'
    deal_discovery_scheduler_refresh_days:
      type: integer
      label: 'Scheduled deal-discovery rediscovery interval in days'
    deal_discovery_scheduler_minimum_interval_minutes:
      type: integer
      label: 'Minimum minutes between scheduled deal-discovery runs'
    deal_discovery_scheduler_candidate_limit:
      type: integer
      label: 'Scheduled deal-discovery candidate limit'
    deal_discovery_scheduler_site_pages:
      type: integer
      label: 'Scheduled deal-discovery website pages per candidate'
    deal_discovery_scheduler_pause_pending:
      type: integer
      label: 'Pending candidate count that pauses scheduled discovery'
    deal_discovery_scheduler_resume_pending:
      type: integer
      label: 'Pending candidate count at or below which scheduled discovery resumes'
