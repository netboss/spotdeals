spotdeals_data_ingestion.settings:
  type: config_object
  label: 'SpotDeals data ingestion settings'
  mapping:
    page_size:
      type: integer
      label: 'Geoapify page size'
    max_pages:
      type: integer
      label: 'Maximum Geoapify pages'
    request_timeout:
      type: integer
      label: 'Geoapify request timeout'
    category_catalog_url:
      type: string
      label: 'Geoapify category catalog URL'
    category_catalog_max_age:
      type: integer
      label: 'Geoapify category catalog maximum cache age'
    category_catalog_minimum_size:
      type: integer
      label: 'Minimum accepted Geoapify category catalog size'
    mapping_min_score:
      type: float
      label: 'Minimum score for automatic venue-type mappings'
    mapping_ambiguity_delta:
      type: float
      label: 'Minimum score gap required to avoid ambiguous mappings'
    deal_discovery_auto_approve_score:
      type: integer
      label: 'Deal discovery automatic-approval score'
    deal_discovery_auto_approve_location_confidence:
      type: integer
      label: 'Deal discovery automatic-approval location confidence'
    deal_discovery_auto_approve_require_schedule:
      type: boolean
      label: 'Require schedule context for automatic approval'
