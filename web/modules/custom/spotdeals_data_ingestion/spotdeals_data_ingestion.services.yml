services:
  logger.channel.spotdeals_data_ingestion:
    parent: logger.channel_base
    arguments:
      - 'spotdeals_data_ingestion'

  Drupal\spotdeals_data_ingestion\Service\DealDiscoveryService:
    arguments:
      - '@http_client'
      - '@logger.channel.spotdeals_data_ingestion'

  spotdeals_data_ingestion.deal_discovery:
    alias: Drupal\spotdeals_data_ingestion\Service\DealDiscoveryService


  Drupal\spotdeals_data_ingestion\Service\DealDiscoveryStorage:
    arguments:
      - '@database'
      - '@datetime.time'

  spotdeals_data_ingestion.deal_discovery_storage:
    alias: Drupal\spotdeals_data_ingestion\Service\DealDiscoveryStorage


  Drupal\spotdeals_data_ingestion\Service\DealDiscoveryConfidenceClassifier:
    arguments:
      - '@config.factory'
      - '@Drupal\spotdeals_data_ingestion\Service\DealDiscoveryContentQualityService'


  Drupal\spotdeals_data_ingestion\Service\DealDiscoveryContentQualityService: {}

  spotdeals_data_ingestion.deal_discovery_content_quality:
    alias: Drupal\spotdeals_data_ingestion\Service\DealDiscoveryContentQualityService

  Drupal\spotdeals_data_ingestion\Service\DealDiscoveryContentQualityAuditService:
    arguments:
      - '@Drupal\spotdeals_data_ingestion\Service\DealDiscoveryStorage'
      - '@entity_type.manager'
      - '@Drupal\spotdeals_data_ingestion\Service\DealDiscoveryContentQualityService'

  spotdeals_data_ingestion.deal_discovery_content_quality_audit:
    alias: Drupal\spotdeals_data_ingestion\Service\DealDiscoveryContentQualityAuditService

  spotdeals_data_ingestion.deal_discovery_confidence_classifier:
    alias: Drupal\spotdeals_data_ingestion\Service\DealDiscoveryConfidenceClassifier

  Drupal\spotdeals_data_ingestion\Service\DealDiscoveryFieldDeriver: {}

  spotdeals_data_ingestion.deal_discovery_field_deriver:
    alias: Drupal\spotdeals_data_ingestion\Service\DealDiscoveryFieldDeriver

  Drupal\spotdeals_data_ingestion\Service\DealDiscoveryPublishPreviewService:
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@database'
      - '@state'
      - '@Drupal\spotdeals_data_ingestion\Service\GeoapifyClient'
      - '@Drupal\spotdeals_data_ingestion\Service\VenueMapper'
      - '@Drupal\spotdeals_data_ingestion\Service\VenueLocalMatcher'
      - '@Drupal\spotdeals_data_ingestion\Service\DealDiscoveryFieldDeriver'
      - '@Drupal\spotdeals_data_ingestion\Service\DealDiscoveryContentQualityService'

  spotdeals_data_ingestion.deal_discovery_publish_preview:
    alias: Drupal\spotdeals_data_ingestion\Service\DealDiscoveryPublishPreviewService

  Drupal\spotdeals_data_ingestion\Service\DealDiscoveryPublisher:
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@lock'
      - '@Drupal\spotdeals_data_ingestion\Service\DealDiscoveryStorage'
      - '@Drupal\spotdeals_data_ingestion\Service\DealDiscoveryPublishPreviewService'
      - '@Drupal\spotdeals_data_ingestion\Service\VenuePersistenceService'
      - '@Drupal\spotdeals_data_ingestion\Service\SpanishNodeTranslationCreator'

  spotdeals_data_ingestion.deal_discovery_publisher:
    alias: Drupal\spotdeals_data_ingestion\Service\DealDiscoveryPublisher

  Drupal\spotdeals_data_ingestion\Service\DealDiscoveryPublishAuditService:
    arguments:
      - '@Drupal\spotdeals_data_ingestion\Service\DealDiscoveryStorage'
      - '@Drupal\spotdeals_data_ingestion\Service\DealDiscoveryPublishPreviewService'

  spotdeals_data_ingestion.deal_discovery_publish_audit:
    alias: Drupal\spotdeals_data_ingestion\Service\DealDiscoveryPublishAuditService

  Drupal\spotdeals_data_ingestion\Service\DealDiscoveryLocationResolver:
    arguments:
      - '@database'

  spotdeals_data_ingestion.deal_discovery_location_resolver:
    alias: Drupal\spotdeals_data_ingestion\Service\DealDiscoveryLocationResolver

  Drupal\spotdeals_data_ingestion\Service\GeoapifyClient:
    arguments:
      - '@http_client'
      - '@logger.channel.spotdeals_data_ingestion'

  Drupal\spotdeals_data_ingestion\Service\GeoapifyVenueResolver:
    arguments:
      - '@Drupal\spotdeals_data_ingestion\Service\GeoapifyClient'

  Drupal\spotdeals_data_ingestion\Service\GeoapifyCategoryCatalog:
    arguments:
      - '@http_client'
      - '@config.factory'
      - '@state'
      - '@logger.channel.spotdeals_data_ingestion'

  Drupal\spotdeals_data_ingestion\Service\VenueTypeMappingManager:
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@Drupal\spotdeals_data_ingestion\Service\GeoapifyCategoryCatalog'
      - '@Drupal\spotdeals_data_ingestion\Service\VenueTypeResolver'
      - '@logger.channel.spotdeals_data_ingestion'

  Drupal\spotdeals_data_ingestion\Service\VenueTypeResolver:
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'

  Drupal\spotdeals_data_ingestion\Service\VenueMapper:
    arguments:
      - '@Drupal\spotdeals_data_ingestion\Service\VenueTypeResolver'

  Drupal\spotdeals_data_ingestion\Service\SpanishNodeTranslationCreator:
    arguments:
      - '@datetime.time'
      - '@pathauto.generator'

  Drupal\spotdeals_data_ingestion\Service\VenueCandidateValidator:
    arguments:
      - '@entity_type.manager'
      - '%app.root%'

  Drupal\spotdeals_data_ingestion\Service\VenueDuplicateChecker:
    arguments:
      - '@entity_type.manager'

  Drupal\spotdeals_data_ingestion\Service\VenueLocalMatcher:
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'

  Drupal\spotdeals_data_ingestion\Service\VenueDealPresenceMatcher:
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'

  Drupal\spotdeals_data_ingestion\Service\VenueSearchDeduplicator: {}

  Drupal\spotdeals_data_ingestion\Service\VenueSearchResultBuilder:
    arguments:
      - '@entity_type.manager'

  spotdeals_data_ingestion.geoapify_client:
    alias: Drupal\spotdeals_data_ingestion\Service\GeoapifyClient

  spotdeals_data_ingestion.geoapify_venue_resolver:
    alias: Drupal\spotdeals_data_ingestion\Service\GeoapifyVenueResolver

  spotdeals_data_ingestion.geoapify_category_catalog:
    alias: Drupal\spotdeals_data_ingestion\Service\GeoapifyCategoryCatalog

  spotdeals_data_ingestion.venue_type_mapping_manager:
    alias: Drupal\spotdeals_data_ingestion\Service\VenueTypeMappingManager

  spotdeals_data_ingestion.venue_type_resolver:
    alias: Drupal\spotdeals_data_ingestion\Service\VenueTypeResolver

  spotdeals_data_ingestion.venue_mapper:
    alias: Drupal\spotdeals_data_ingestion\Service\VenueMapper

  spotdeals_data_ingestion.venue_duplicate_checker:
    alias: Drupal\spotdeals_data_ingestion\Service\VenueDuplicateChecker

  spotdeals_data_ingestion.venue_local_matcher:
    alias: Drupal\spotdeals_data_ingestion\Service\VenueLocalMatcher

  spotdeals_data_ingestion.venue_candidate_validator:
    alias: Drupal\spotdeals_data_ingestion\Service\VenueCandidateValidator

  spotdeals_data_ingestion.venue_deal_presence_matcher:
    alias: Drupal\spotdeals_data_ingestion\Service\VenueDealPresenceMatcher

  spotdeals_data_ingestion.venue_search_deduplicator:
    alias: Drupal\spotdeals_data_ingestion\Service\VenueSearchDeduplicator

  spotdeals_data_ingestion.venue_search_result_builder:
    alias: Drupal\spotdeals_data_ingestion\Service\VenueSearchResultBuilder

  Drupal\spotdeals_data_ingestion\Service\ExternalVenueReportStorage:
    arguments:
      - '@database'
      - '@datetime.time'

  spotdeals_data_ingestion.external_venue_report_storage:
    alias: Drupal\spotdeals_data_ingestion\Service\ExternalVenueReportStorage


  Drupal\spotdeals_data_ingestion\Service\VenuePersistenceService:
    arguments:
      - '@entity_type.manager'
      - '@Drupal\spotdeals_data_ingestion\Service\VenueLocalMatcher'
      - '@Drupal\spotdeals_data_ingestion\Service\SpanishNodeTranslationCreator'

  spotdeals_data_ingestion.venue_persistence:
    alias: Drupal\spotdeals_data_ingestion\Service\VenuePersistenceService
